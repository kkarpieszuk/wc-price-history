name: Deploy to WordPress.org

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    name: Deploy to WordPress.org and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from readme.txt
        id: version
        run: |
          VERSION=$(grep -oP '(?<=Stable tag: ).*' readme.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Replace version placeholders
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          source .scripts/replace-version.sh
          replace_version_number
          replace_version_always_top

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate POT file
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          php wp-cli.phar i18n make-pot . languages/wc-price-history.pot --allow-root

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: wc-price-history
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: '.'
          ASSETS_DIR: '.wordpress-org'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
          generate_release_notes: false
          body: |
            Release ${{ steps.version.outputs.version }}

            See changelog in readme.txt for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
